name: Daily review refresh

on:
  schedule:
    # 01:00 UTC = 6:30 AM IST — 30 min ahead of the Claude routine that
    # republishes the artifacts, so fresh data is already pushed by then.
    - cron: "0 1 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Fetch reviews and rebuild dashboard data
        run: npm run all

      - name: Build site/ for Vercel
        run: npm run build:site

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/raw data/out site
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Automated review data refresh - $(date -u +%Y-%m-%d)"
            git pull --rebase origin main
            git push
          fi
